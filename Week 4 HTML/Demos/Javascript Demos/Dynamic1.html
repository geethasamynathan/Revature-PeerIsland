  <body>
    <h2 id="msg">Toggle this text</h2>
    <button onclick="toggleText()">Toggle</button>

    <script>
      function toggleText() {

        let text=document.getElementById("msg");
        if(text.style.display==="none"){
            text.style.display="block";
        }else{
text.style.display="none";
        }
       
      }
    </script>
  </body>
</html>

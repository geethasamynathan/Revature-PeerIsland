<!doctype html>
<html lang="en">
  <head>
    <style>
      .container {
        display: flex;
      }
      .red {
        background: orangered;
        display: flex;
        flex-direction: column;
      }

      .green {
        background: yellowgreen;
      }
      .blue {
        background: steelblue;
        width: 40vw;
      }

      .container > div {
        /* font-size: 5vw; */
        padding: 5em;
        color: white;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="red">
        1
        <div class="green">1a</div>
        <div class="blue">1b</div>
      </div>
      <div class="green">2</div>
      <div class="blue">3</div>
    </div>
  </body>
</html>

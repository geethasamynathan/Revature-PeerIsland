<!doctype html>
<html>
  <head>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }

      #main {
        display: flex;
        flex: 1;
      }
      #main > article {
        flex: 1;
      }

      #main > nav,
      #main > aside {
        flex: 0 0 20vw;
        background: beige;
      }

      #main > nav {
        order: -1;
      }

      header,
      footer,
      article,
      nav,
      aside {
        padding: 1em;
      }

      header,
      footer {
        background-color: yellowgreen;
        height: 20vh;
      }
    </style>
  </head>
  <body>
    <header>Header</header>
    <div id="main">
      <article>Article</article>
      <nav>Nav</nav>
      <aside>Aside</aside>
    </div>
    <footer>Footer</footer>
  </body>
</html>

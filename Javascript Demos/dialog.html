<html>
  <head>
    <script>
      function loadData() {
        document.write(" Data loaded after button click");
      }

      function showAlert() {
        alert(" you clicked alert button");
      }

      function showConfirm() {
        let result = confirm(" you clicked the button");
        console.log(result);
        if (result === true) {
          alert("you clicked OK Button in the confirm box");
        } else {
          alert("you clicked Cancel Button in the confirm box");
        }
      }

      function showPrompt() {
        let empId = prompt(" Enter the Employee Id ");
        alert(" Entered Employee Id is " + empId);
      }
      //   document.write("Sample TExt from Javascript ");
      //   document.write("<br/> Second line");
      //   document.write("Sample TExt from Javascript ");
      //   document.write("<br/> Second line");
    </script>
  </head>
  <body>
    <button type="button" onclick="showAlert()">Alert Dialogue</button>
    <button type="button" onclick="showConfirm()">Confirm Dialogue</button>
    <button type="button" onclick="showPrompt()">Prompt Dialogue</button>
  </body>
</html>
